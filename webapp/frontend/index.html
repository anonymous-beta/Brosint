<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>BROsint // recon console</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.9/vis-network.min.js"></script>
<style>
  :root{
    --ink:#05080d;
    --panel:#0a1018;
    --line:#152233;
    --teal:#1fd6c0;
    --violet:#7a3cff;
    --amber:#ffb454;
    --text:#cfe8e4;
    --dim:#5c7a78;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:var(--ink);color:var(--text);
    font-family: "JetBrains Mono","Fira Code",ui-monospace,Menlo,monospace;}
  body{display:flex;flex-direction:column;}

  header{
    padding:18px 24px; border-bottom:1px solid var(--line);
    display:flex; align-items:baseline; gap:14px;
    background:linear-gradient(180deg,#070b12,#05080d);
  }
  header h1{
    font-family:"Space Grotesk","Segoe UI",sans-serif;
    font-size:20px; letter-spacing:0.06em; margin:0; color:var(--teal);
    text-shadow:0 0 18px rgba(31,214,192,0.35);
  }
  header .tag{font-size:11px; color:var(--dim); letter-spacing:0.12em;}

  #layout{flex:1; display:flex; min-height:0;}

  #controls{
    width:300px; padding:20px; border-right:1px solid var(--line);
    background:var(--panel); display:flex; flex-direction:column; gap:14px;
    overflow-y:auto;
  }
  label{font-size:11px; color:var(--dim); letter-spacing:0.1em; text-transform:uppercase;}
  select, input{
    width:100%; padding:9px 10px; background:#060a10; border:1px solid var(--line);
    color:var(--text); border-radius:3px; font-family:inherit; font-size:13px;
  }
  select:focus, input:focus{outline:none; border-color:var(--teal);}
  button{
    padding:10px; background:transparent; color:var(--teal);
    border:1px solid var(--teal); border-radius:3px; font-family:inherit;
    font-size:13px; letter-spacing:0.08em; cursor:pointer; transition:all .15s;
  }
  button:hover{background:rgba(31,214,192,0.1); box-shadow:0 0 14px rgba(31,214,192,0.25);}
  button:disabled{opacity:0.4; cursor:default;}

  #modlist{display:flex; flex-direction:column; gap:6px; font-size:11px; color:var(--dim);}
  #modlist .mod{display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px dotted var(--line);}
  #modlist .on{color:var(--teal);}

  #stage{flex:1; position:relative; background:
    radial-gradient(ellipse at 50% 0%, rgba(122,60,255,0.08), transparent 60%),
    var(--ink);}
  #graph{position:absolute; inset:0;}

  #detail{
    width:340px; padding:20px; border-left:1px solid var(--line);
    background:var(--panel); overflow-y:auto; font-size:12.5px;
  }
  #detail h2{font-size:13px; color:var(--violet); letter-spacing:0.08em; margin:0 0 10px;}
  #detail .field{margin-bottom:10px;}
  #detail .k{color:var(--dim); font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em;}
  #detail .v{color:var(--text); word-break:break-word;}
  #empty-hint{color:var(--dim); font-size:12px; line-height:1.6;}

  #status{padding:6px 24px; font-size:11px; color:var(--dim); border-top:1px solid var(--line);}
  .pulse{color:var(--amber);}
</style>
</head>
<body>

<header>
  <h1>◆ BROsint</h1>
  <span class="tag">RECON CONSOLE — LOCALHOST ONLY</span>
</header>

<div id="layout">
  <div id="controls">
    <div>
      <label>Target type</label>
      <select id="target_type">
        <option value="domain">domain</option>
        <option value="email">email</option>
        <option value="username">username</option>
        <option value="ip">ip</option>
      </select>
    </div>
    <div>
      <label>Value</label>
      <input id="target_value" placeholder="e.g. example.com" />
    </div>
    <button id="run_btn">▶ RUN SCAN</button>
    <div id="status_line" style="font-size:11px;color:var(--dim);"></div>

    <div style="margin-top:10px;">
      <label>Modules</label>
      <div id="modlist"></div>
    </div>
  </div>

  <div id="stage">
    <div id="graph"></div>
  </div>

  <div id="detail">
    <div id="empty-hint">
      Run a scan to populate the graph. Click any node to inspect its
      raw data here.<br /><br />
      Teal nodes are the target you searched. Violet nodes are findings
      produced by a module. Edges show where a finding came from.
    </div>
  </div>
</div>

<div id="status">idle</div>

<script>
const API = "";
let network = null;

async function loadModules(){
  const res = await fetch(API + "/api/modules");
  const mods = await res.json();
  const list = document.getElementById("modlist");
  list.innerHTML = "";
  mods.forEach(m => {
    const div = document.createElement("div");
    div.className = "mod";
    div.innerHTML = `<span class="${m.available ? 'on' : ''}">${m.name}</span><span>${m.available ? 'ready' : 'no key'}</span>`;
    list.appendChild(div);
  });
}

function renderGraph(graph){
  const nodes = new vis.DataSet(graph.nodes.map(n => ({
    id: n.id,
    label: n.label.length > 28 ? n.label.slice(0,26)+"…" : n.label,
    shape: n.group === "target" ? "hexagon" : "dot",
    size: n.group === "target" ? 26 : 14,
    color: n.group === "target"
      ? { background:"#1fd6c0", border:"#0d3b36" }
      : { background:"#7a3cff", border:"#2a1266" },
    font: { color:"#cfe8e4", face:"JetBrains Mono", size:12 },
    _raw: n,
  })));
  const edges = new vis.DataSet(graph.edges.map(e => ({
    from: e.from, to: e.to,
    color: { color:"#1fd6c055", highlight:"#1fd6c0" },
    width: 1.4,
  })));

  const container = document.getElementById("graph");
  const data = { nodes, edges };
  const options = {
    physics: { stabilization:true, barnesHut:{ gravitationalConstant:-3200, springLength:110 } },
    interaction: { hover:true },
  };
  network = new vis.Network(container, data, options);

  network.on("click", params => {
    if (!params.nodes.length) return;
    const node = nodes.get(params.nodes[0]);
    showDetail(node._raw);
  });
}

function showDetail(n){
  const el = document.getElementById("detail");
  let html = `<h2>${n.group === "target" ? "TARGET" : "FINDING"}</h2>`;
  html += field("Label", n.label);
  if (n.type) html += field("Type", n.type);
  if (n.module) html += field("Module", n.module);
  if (n.confidence) html += field("Confidence", n.confidence);
  if (n.data) {
    html += `<div class="field"><div class="k">Data</div><div class="v"><pre style="white-space:pre-wrap;font-size:11px;color:var(--dim);">${escapeHtml(JSON.stringify(n.data, null, 2))}</pre></div></div>`;
  }
  el.innerHTML = html;
}
function field(k, v){ return `<div class="field"><div class="k">${k}</div><div class="v">${escapeHtml(String(v))}</div></div>`; }
function escapeHtml(s){ return s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

document.getElementById("run_btn").addEventListener("click", async () => {
  const value = document.getElementById("target_value").value.trim();
  const type = document.getElementById("target_type").value;
  const status = document.getElementById("status");
  const btn = document.getElementById("run_btn");
  if (!value) { status.textContent = "enter a target value"; return; }

  btn.disabled = true;
  status.innerHTML = `<span class="pulse">scanning ${value}…</span>`;

  try {
    const res = await fetch(API + "/api/scan", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ value, type }),
    });
    if (!res.ok) throw new Error(await res.text());
    const payload = await res.json();
    renderGraph(payload.graph);
    status.textContent = `done — ${payload.result.findings.length} findings, ${payload.result.errors.length} errors [scan ${payload.scan_id}]`;
  } catch (e) {
    status.textContent = "error: " + e.message;
  } finally {
    btn.disabled = false;
  }
});

loadModules();
</script>
</body>
</html>
